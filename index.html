<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12242C">
<title>Denní pohyb</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Denní pohyb">
<style>
:root{
  --bg:#EDF1F3; --card:#FFFFFF; --ink:#12242C; --ink2:#3D525C; --ink3:#67808B;
  --line:#D2DCE1; --teal:#0E7C6B; --teal-d:#0A5B4E; --red:#B3261E; --red-bg:#FDF3F2;
  --sand:#F4E8D2; --r:16px;
  --pad: max(16px, env(safe-area-inset-left));
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 19px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1{font-size:31px;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px;font-weight:750}
h2{font-size:23px;line-height:1.25;letter-spacing:-.01em;margin:28px 0 10px;font-weight:700}
h3{font-size:20px;margin:0 0 6px;font-weight:700}
p{margin:0 0 12px}
a{color:var(--teal-d)}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--pad) 48px}

/* ---------- horní lišta ---------- */
.bar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;
  display:flex;align-items:center;gap:12px;
}
.bar .t{font-weight:700;font-size:18px;flex:1;letter-spacing:-.01em;text-align:center}
.bar .hotovo{
  flex:none;border:0;border-radius:11px;background:var(--teal);color:#fff;
  font:inherit;font-weight:700;font-size:16px;padding:11px 14px;cursor:pointer;
  min-height:44px;white-space:nowrap
}
.bar .hotovo:active{transform:translateY(1px)}
.back{
  border:0;background:none;font:inherit;font-weight:600;color:var(--teal-d);
  padding:8px 4px;margin-left:-4px;cursor:pointer;font-size:17px;
}

/* ---------- karty a tlačítka ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.btn{
  display:block;width:100%;border:0;border-radius:14px;padding:18px;
  font:inherit;font-weight:700;font-size:20px;text-align:center;text-decoration:none;
  background:var(--teal);color:#fff;cursor:pointer;margin:10px 0;
  box-shadow:0 1px 0 rgba(0,0,0,.06);
}
.btn:active{transform:translateY(1px)}
.btn.big{padding:26px 18px;font-size:24px;letter-spacing:-.01em}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--red)}
.btn.small{padding:13px;font-size:17px}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 0;min-width:0}
.btn{overflow-wrap:break-word}

/* ---------- domů ---------- */
.hero{
  background:var(--ink);color:#fff;border-radius:20px;padding:22px;margin:16px 0 10px;
}
.hero .d{font-size:15px;color:#9DB4BF;text-transform:uppercase;letter-spacing:.08em;font-weight:650}
.hero .n{font-size:34px;font-weight:750;letter-spacing:-.02em;margin:6px 0 2px}
.hero .s{font-size:17px;color:#B9CDD6}
.pill{display:inline-block;background:#1F3D4A;color:#9FE0D2;border-radius:99px;padding:5px 12px;font-size:14px;font-weight:650;margin-top:12px}

.streak{display:flex;gap:6px;margin-top:14px}
.streak i{flex:1;height:8px;border-radius:4px;background:#2A4A58}
.streak i.on{background:var(--teal)}

/* ---------- fáze cviku ---------- */
.panel{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:14px}
.panel-bad{background:var(--red-bg);border-color:#F0C9C6}
.f-line{fill:none;stroke:#23404D;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.f-cue{fill:none;stroke:#0E7C6B;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.f-bad{fill:none;stroke:#B3261E;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.f-head{fill:#23404D}
.f-badhead{fill:#B3261E}
.f-chair{fill:none;stroke:#A9B8C0;stroke-width:9;stroke-linecap:round}
.f-floor{stroke:#A9B8C0;stroke-width:4;stroke-linecap:round}
.f-dash{fill:none;stroke:#0E7C6B;stroke-width:3;stroke-dasharray:9 9;stroke-linecap:round}
.f-arrow{fill:#0E7C6B}
.f-cross line{stroke:#B3261E;stroke-width:9;stroke-linecap:round}
.f-tag{font:600 20px "Inter",system-ui,sans-serif;fill:#0E7C6B}
.f-tagbad{font:600 20px "Inter",system-ui,sans-serif;fill:#B3261E}

.faze{margin:16px 0}
.faze .lbl{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-weight:700;font-size:19px}
.num{
  flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:16px;font-weight:700
}
.num.bad{background:var(--red)}

/* ---------- seznamy ---------- */
ol.kroky{margin:0;padding-left:24px}
ol.kroky li{margin:0 0 12px}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:12px 0;border-bottom:1px solid var(--line)}
ul.plain li:last-child{border:0}

.note{border-left:5px solid var(--teal);background:#EAF5F2;border-radius:0 12px 12px 0;padding:14px 16px;margin:14px 0}

/* ---------- čtení nahlas ---------- */
.btn.tts{
  background:#E4EFEC;color:var(--teal-d);border:2px solid var(--teal);
  font-size:19px;padding:16px;margin:0 0 14px
}
ol.kroky li.krok-akt{
  background:#DCF0EA;border-left:5px solid var(--teal);
  margin-left:-20px;padding:8px 10px 8px 15px;border-radius:0 10px 10px 0;
  font-weight:600
}
.note.red.krok-akt{background:#FBE7E5;border-left-width:9px}
.note.red{border-color:var(--red);background:var(--red-bg)}
.note .h{font-weight:750;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--teal-d);margin-bottom:4px}
.note.red .h{color:var(--red)}

.meta{color:var(--ink3);font-size:17px}
.tagline{display:inline-block;background:#DFE8EC;border-radius:99px;padding:4px 11px;font-size:15px;font-weight:650;color:var(--ink2);margin:0 6px 6px 0}

/* ---------- lekce ---------- */
.prog{display:flex;gap:4px;margin:0 0 4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--teal)}
.timer{
  font-variant-numeric:tabular-nums;font-size:76px;font-weight:750;letter-spacing:-.04em;
  text-align:center;margin:10px 0 0;line-height:1
}
.timer.done{color:var(--teal)}
.counter{text-align:center;font-size:22px;font-weight:650;margin:14px 0 0}

.patka{display:flex;gap:10px;padding:22px 0 calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:26px}
.patka .btn{flex:1 1 0;min-width:0;margin:0}

/* ---------- kola cviku (série a strany) ---------- */
.kolo{
  text-align:center;font-weight:750;font-size:21px;letter-spacing:-.01em;
  color:var(--teal-d);margin:0 0 10px
}
.kolapruh{display:flex;gap:6px;justify-content:center;margin:0 0 4px}
.kolapruh i{width:26px;height:7px;border-radius:4px;background:var(--line)}
.kolapruh i.hotovo{background:var(--teal)}
.kolapruh i.ted{background:var(--ink)}

/* ---------- nastavení ---------- */
.tog{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border:0}
.tog .nm{flex:1;font-weight:600}
.sw{flex:none;width:58px;height:34px;border-radius:99px;background:#C3D0D6;border:0;position:relative;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--teal)}
.sw[aria-checked="true"]::after{transform:translateX(24px)}
input[type=date],input[type=url]{
  width:100%;font:inherit;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)
}

/* ---------- tisk ---------- */
.pr-only{display:none}
.chk{display:flex;gap:8px;margin-top:6px}
.chk span{border:1.5px solid #333;border-radius:5px;padding:3px 12px;font-size:14px}
@media print{
  body{background:#fff;font-size:11pt}
  .bar,.patka,.noprint{display:none !important}
  .pr-only{display:block}
  .wrap{max-width:none;padding:0}
  .card{border:0;border-bottom:1px solid #bbb;border-radius:0;padding:8px 0;margin:0;page-break-inside:avoid}
  h1{font-size:18pt}
  h2{font-size:13pt;margin:14pt 0 4pt}
  .panel{display:none}
}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="wrap" id="app"></div>
<script src="cviky.js"></script>
<script src="app.js"></script>
</body>
</html>
